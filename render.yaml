services:
  - type: web
    name: binth-web
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: binth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: ADMIN_DEFAULT_EMAIL
        value: admin@binth.in
      - key: ADMIN_DEFAULT_PASSWORD
        generateValue: true

databases:
  - name: binth-db
    plan: free
    databaseName: binth
    user: binth_user
