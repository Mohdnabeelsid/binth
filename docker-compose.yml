services:
  db:
    image: postgres:15-alpine
    container_name: binth_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-binth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pg_secret_only}
      POSTGRES_DB: ${POSTGRES_DB:-binth_development}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binth_user -d binth_development"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binth_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-binth_user}:${POSTGRES_PASSWORD:-dev_pg_secret_only}@db:5432/${POSTGRES_DB:-binth_development}
      JWT_SECRET: ${JWT_SECRET:-dev_jwt_secret_must_be_overridden_in_prod_at_least_32_chars}
      IP_HASH_SALT: ${IP_HASH_SALT:-dev_ip_salt_must_be_overridden_in_prod}
      CORS_ORIGIN: "http://localhost:3000,http://127.0.0.1:3000"
    ports:
      - "3000:3000"

volumes:
  pgdata:
