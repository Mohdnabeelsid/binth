services:
  db:
    image: postgres:15-alpine
    container_name: binth_db
    restart: always
    environment:
      POSTGRES_USER: binth_user
      POSTGRES_PASSWORD: binth_secure_password_2026
      POSTGRES_DB: binth_production
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binth_user -d binth_production"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: binth_app
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://binth_user:binth_secure_password_2026@db:5432/binth_production
      JWT_SECRET: replace_with_long_random_jwt_secret_for_production
      CORS_ORIGIN: "*"
      ADMIN_DEFAULT_EMAIL: admin@binth.in
      ADMIN_DEFAULT_PASSWORD: BinthAdmin2026!
    ports:
      - "3000:3000"

volumes:
  pgdata:
